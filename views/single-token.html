<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoResearch Analytics</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header class="research-header">
      <div class="header-content">
        <i class="fas fa-chart-line"></i>
        <h1>CryptoResearch Analytics</h1>
        <p>Academic-grade cryptocurrency analysis for research purposes</p>
      </div>
    </header>

    <main class="main-content">
      <!-- Search Component -->
      <section id="search-section" class="search-section card">
        <!-- TokenSearch.js will render here -->
      </section>

      <!-- Details Component -->
      <section id="details-section" class="crypto-details card hidden">
        <!-- TokenDetails.js will render here -->
      </section>

      <!-- Chart Component -->
      <section class="chart-section card">
        <div class="section-header">
          <h2><i class="fas fa-chart-line"></i> Price History</h2>
          <p>Historical price performance analysis</p>
        </div>
        <div class="chart-container">
          <canvas id="historical-chart"></canvas>
        </div>
      </section>

      <!-- Table Component -->
      <section id="table-section" class="data-section card">
        <!-- TokenTable.js will render here -->
      </section>
    </main>

    <footer class="research-footer">
      <p>Academic Research Tool • Data provided by CoinMarketCap API • For research purposes only</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Component Files -->
  <script src="/js/components/singleToken/TokenSearch.js"></script>
  <script src="/js/components/singleToken/TokenDetails.js"></script>
  <script src="/js/components/singleToken/TokenChart.js"></script>
  <script src="/js/components/singleToken/TokenTable.js"></script>
  
  <!-- Main App -->
  <script src="/js/components/main.js"></script>
</body>
</html>
